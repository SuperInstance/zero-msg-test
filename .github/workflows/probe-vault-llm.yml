name: probe-vault-llm-actions

on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV
      - name: Probe llm actions
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          VAULT_URL: https://superinstance-vault.casey-digennaro.workers.dev
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request, urllib.error
          for action in ["list","models","help","info","status","capabilities","complete","chat"]:
              body = {"oidc_token": os.environ["OIDC_TOKEN"], "service": "llm",
                      "action": action, "params": {}}
              req = urllib.request.Request(os.environ["VAULT_URL"]+"/proxy", data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","User-Agent":"purplepincher-zero/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print("LLM", action, "-> OK", r.read().decode()[:600])
              except urllib.error.HTTPError as e:
                  print("LLM", action, "-> HTTP", e.code, e.read().decode(errors="replace")[:250])
              except Exception as e:
                  print("LLM", action, "-> ERR", type(e).__name__, str(e)[:120])
          PY
