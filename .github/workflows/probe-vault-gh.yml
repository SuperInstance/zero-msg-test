name: probe-vault-github-write

on:
  workflow_dispatch:
    inputs:
      action:
        required: false
        default: 'get_repo'
      params:
        required: false
        default: '{"owner":"SuperInstance","repo":"AI-Writings"}'

permissions:
  id-token: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV
      - name: Probe vault github actions
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          VAULT_URL: https://superinstance-vault.casey-digennaro.workers.dev
          ACT: ${{ inputs.action }}
          PARAMS: ${{ inputs.params }}
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request, urllib.error
          ACTS = ["get_repo","list_files","get_file","create_file","update_file","commit_file",
                  "put_file","create_or_update_file","push_files","create_branch","list_branches",
                  "create_pull_request","create_issue","list_issues","write_file","delete_file",
                  "create_commit","get_contents","get_tree","list_commits","create_blob","create_tree",
                  "create_ref","update_ref","merge_pull_request","search_code"]
          for a in ACTS:
              body = {"oidc_token": os.environ["OIDC_TOKEN"], "service": "github",
                      "action": a, "params": json.loads(os.environ.get("PARAMS") or "{}")}
              req = urllib.request.Request(os.environ["VAULT_URL"]+"/proxy", data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","User-Agent":"purplepincher-zero/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print("ACT", a, "-> OK", r.status, r.read().decode()[:200])
              except urllib.error.HTTPError as e:
                  print("ACT", a, "-> HTTP", e.code, e.read().decode(errors="replace")[:200])
              except Exception as e:
                  print("ACT", a, "-> ERR", type(e).__name__, str(e)[:120])
          PY
