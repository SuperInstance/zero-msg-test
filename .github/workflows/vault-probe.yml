name: vault-probe

on:
  workflow_dispatch:
    inputs:
      action:
        required: false
        default: 'list'
      service:
        required: false
        default: 'llm'
      params:
        required: false
        default: '{}'

permissions:
  id-token: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV
      - name: Probe
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          VAULT_URL: https://superinstance-vault.casey-digennaro.workers.dev
          ACT: ${{ inputs.action }}
          SVC: ${{ inputs.service }}
          PARAMS: ${{ inputs.params }}
        run: |
          set -uo pipefail
          python3 - <<'PY' || true
          import json, os, urllib.request, urllib.error
          body = {"oidc_token": os.environ["OIDC_TOKEN"], "service": os.environ["SVC"],
                  "action": os.environ["ACT"], "params": json.loads(os.environ.get("PARAMS") or "{}")}
          req = urllib.request.Request(os.environ["VAULT_URL"]+"/proxy", data=json.dumps(body).encode(),
              headers={"Content-Type":"application/json","User-Agent":"purplepincher-zero/1.0"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("HTTP", r.status, r.read().decode()[:3000])
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, e.read().decode(errors="replace")[:2000])
          except Exception as e:
              print("ERR", type(e).__name__, e)
          PY
