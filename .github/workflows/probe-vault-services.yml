name: probe-vault-services

on:
  workflow_dispatch:
    inputs:
      svc:
        required: false
        default: 'github'

permissions:
  id-token: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV
      - name: Probe services
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          VAULT_URL: https://superinstance-vault.casey-digennaro.workers.dev
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request, urllib.error
          # 1) ask the vault for a github token
          for action, params in [("get_token", {}), ("token", {}), ("get_github_token", {}),
                                  ("github_token", {}), ("create_token", {}), ("list", {})]:
              body = {"oidc_token": os.environ["OIDC_TOKEN"], "service": "github",
                      "action": action, "params": params}
              req = urllib.request.Request(os.environ["VAULT_URL"]+"/proxy", data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","User-Agent":"purplepincher-zero/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print("GH", action, "-> OK", r.read().decode()[:400])
              except urllib.error.HTTPError as e:
                  print("GH", action, "-> HTTP", e.code, e.read().decode(errors="replace")[:200])
              except Exception as e:
                  print("GH", action, "-> ERR", type(e).__name__, str(e)[:120])
          # 2) which services exist?
          for svc in ["llm","github","cloudflare","telegram","openai","anthropic","secrets","proxy","list","help","status"]:
              body = {"oidc_token": os.environ["OIDC_TOKEN"], "service": svc,
                      "action": "list", "params": {}}
              req = urllib.request.Request(os.environ["VAULT_URL"]+"/proxy", data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","User-Agent":"purplepincher-zero/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print("SVC", svc, "-> OK", r.read().decode()[:300])
              except urllib.error.HTTPError as e:
                  print("SVC", svc, "-> HTTP", e.code, e.read().decode(errors="replace")[:200])
              except Exception as e:
                  print("SVC", svc, "-> ERR", type(e).__name__, str(e)[:120])
          PY
