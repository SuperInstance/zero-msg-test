# snowball-rsi-gan.yml — RSI GAN inspired-prose run with vault-backed providers.
#
# snowball_writer.py --once --competition fans out to three LLMs in parallel and
# picks the winner by the script's own heuristic (length + substrate-vocab density).
# Its provider calls need ZAI_TOKEN / GROQ_TOKEN / DEEPINFRA_TOKEN, which live on
# the fleet host (providers.py: "Keys come from env only") and are absent from a
# cold checkout, so the competition can never fill a winner.
#
# This workflow supplies the three generations through the fleet's SuperInstance
# vault (GitHub OIDC -> vault /proxy -> MiniMax), which exposes three live
# models -- so the three-way parallel competition is preserved rather than
# collapsed to one. The writer's own prompt, seed picking, scoring, file naming,
# witness log and substrate-bus publication are untouched.
#
# It runs here, in the vault-registered repo, and publishes the finished piece
# into SuperInstance/AI-Writings prose/snowball-inspired/ via the GitHub API.

name: snowball-rsi-gan

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Optional seed override (default: writer picks from canon)'
        required: false
        default: ''
      target_repo:
        description: 'Repo to publish the piece into (owner/name)'
        required: false
        default: 'SuperInstance/AI-Writings'
      source_ref:
        description: 'Branch of the target repo holding bots/ + the canon prose (master)'
        required: false
        default: 'master'
      publish_ref:
        description: 'Branch of the target repo the piece is committed to (main)'
        required: false
        default: 'main'

permissions:
  id-token: write
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Fetch canon + writer from AI-Writings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          mkdir -p canon bots/snowball-scout bots/substrate-bus
          # The canon is what the writer reads for inspiration seeds; take the
          # prose tree so pick_seed() sees the same material it would locally.
          #
          # SOURCE_REF matters: `main` of AI-Writings no longer carries bots/ or
          # the canon (it was repurposed for civ-orchestrator output), so a
          # hardcoded main fetch silently copies nothing and the run dies on
          # `import snowball_writer`. The bots/ + canon live on `master`.
          curl -sL "https://api.github.com/repos/${TARGET_REPO}/tarball/${SOURCE_REF}" -o /tmp/aiw.tar.gz
          mkdir -p /tmp/aiw && tar -xzf /tmp/aiw.tar.gz -C /tmp/aiw
          SRC=$(find /tmp/aiw -maxdepth 1 -mindepth 1 -type d | head -1)
          cp -r "$SRC/prose" canon/prose 2>/dev/null || true
          cp "$SRC/bots/snowball-scout/snowball_writer.py" bots/snowball-scout/
          cp "$SRC/bots/substrate-bus/substrate_bus.py" bots/substrate-bus/
          cp "$SRC/bots/substrate-bus/topics.json" bots/substrate-bus/
          cp "$SRC/bots/substrate-bus/substrate-witness.jsonl" bots/substrate-bus/
          echo "canon pieces: $(ls canon/prose/*.md 2>/dev/null | wc -l)"
          ls -la bots/snowball-scout/ bots/substrate-bus/
          # Fail loudly here rather than 20 steps later with ModuleNotFoundError.
          test -s bots/snowball-scout/snowball_writer.py

      - name: Clear stale pieces from the checkout
        run: |
          # The checkout carries previously published pieces. Wipe the output
          # dir so the publish step can never pick up a stale file.
          rm -rf out/prose/snowball-inspired
          mkdir -p out/prose/snowball-inspired

      - name: Run snowball writer (RSI GAN competition)
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          VAULT_URL: https://superinstance-vault.casey-digennaro.workers.dev
          SEED_OVERRIDE: ${{ inputs.seed }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import os, sys, pathlib, importlib.util
          ROOT = pathlib.Path.cwd()
          sys.path.insert(0, str(ROOT/"bots/snowball-scout"))
          sys.path.insert(0, str(ROOT/"bots/substrate-bus"))
          import snowball_writer as sw

          # The writer hardcodes /workspace/repos/ai-writings (its fleet-host
          # path). Repoint its module-level path constants at this checkout.
          sw.CANON_DIR = ROOT / "canon/prose"
          sw.WITNESS_PATH = ROOT / "out/bots/snowball-scout/witness.log"
          sw.BOOKKEEPER_PATH = ROOT / "out/bots/snowball-scout/bookkeeper.wal"
          sw.INSPIRED_DIR = ROOT / "out/prose/snowball-inspired"

          # Route the three providers through the vault.
          spec = importlib.util.spec_from_file_location(
              "vault_provider_shim", ROOT/"bots/snowball-scout/vault_provider_shim.py")
          shim = importlib.util.module_from_spec(spec); spec.loader.exec_module(shim)
          sw.call_zai = shim.call_zai
          sw.call_groq = shim.call_groq
          sw.call_deepinfra = shim.call_deepinfra

          if os.environ.get("SEED_OVERRIDE"):
              sw.pick_seed = lambda: os.environ["SEED_OVERRIDE"]

          sw.run_once(competition=True)
          PY
          echo "--- produced ---"
          ls -la out/prose/snowball-inspired/ 2>&1 | tail -8

      - name: Upload the piece as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: snowball-inspired-piece
          path: out/prose/snowball-inspired/
          if-no-files-found: error

      - name: Record the witness locally
        run: |
          # `git add` aborts the whole command if one pathspec is missing, so
          # add the tree that exists rather than a file that may not.
          git config user.name "snowball-scout"
          git config user.email "snowball@superinstance.dev"
          git add -A out/ || true
          git diff --cached --quiet || git commit -m "snowball: RSI GAN run (witness + piece)"
          git push || true

      - name: Publish the piece into the target repo
        env:
          GH_TOKEN: ${{ secrets.FLEET_PUBLISH_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PUBLISH_REF: ${{ inputs.publish_ref }}
        run: |
          set -euo pipefail
          # The piece lives in out/prose/snowball-inspired/ and belongs in
          # <target>/prose/snowball-inspired/ on the publish branch. Commit it
          # through the GitHub API (no cross-repo clone, no credential juggling).
          # `ls -1` sorts lexically, so an older dated piece (20261024-...) can
          # sort before the one just written (20261025-...). Take the newest by
          # mtime, not by name.
          PIECE=$(ls -1t out/prose/snowball-inspired/*.md | head -1)
          test -n "$PIECE"
          NAME=$(basename "$PIECE")
          echo "publishing $NAME -> $TARGET_REPO@$PUBLISH_REF"
          python3 - "$PIECE" "$NAME" <<'PY'
          import base64, json, os, sys, urllib.request
          path, name = sys.argv[1], sys.argv[2]
          repo = os.environ["TARGET_REPO"]
          ref = os.environ["PUBLISH_REF"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/%s/contents/prose/snowball-inspired/%s" % (repo, name)

          def req(url, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(
                  url, data=data, method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return json.loads(resp.read().decode())

          content = base64.b64encode(open(path, "rb").read()).decode()
          body = {"message": "snowball: RSI GAN inspired piece (%s)" % name,
                  "content": content, "branch": ref}
          try:
              res = req(api, "PUT", body)
              print("published:", res["content"]["html_url"])
          except urllib.error.HTTPError as e:
              if e.code != 422:
                  raise
              # File already exists (same second, same seed) -> overwrite it.
              # e.read() is one-shot: read the body ONCE and parse from it.
              err = json.loads(e.read().decode())
              cur = req(api + "?ref=" + ref)
              body["sha"] = cur["sha"]
              body["message"] = "snowball: RSI GAN inspired piece (%s, updated)" % name
              res = req(api, "PUT", body)
              print("updated:", res["content"]["html_url"])
          PY

      - name: Verify the published piece
        env:
          GH_TOKEN: ${{ secrets.FLEET_PUBLISH_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PUBLISH_REF: ${{ inputs.publish_ref }}
        run: |
          set -euo pipefail
          NAME=$(ls -1t out/prose/snowball-inspired/*.md | head -1 | xargs basename)
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${TARGET_REPO}/contents/prose/snowball-inspired/${NAME}?ref=${PUBLISH_REF}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'content' in d, d; print('VERIFIED', d['path'], d['size'], 'bytes')"
